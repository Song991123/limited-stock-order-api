plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dev.mentoring'
version = '0.1.0'
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }

if (System.getenv('STOCK_BUILD_DIR')) {
    layout.buildDirectory.set(file(System.getenv('STOCK_BUILD_DIR')))
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.named('javadoc') {
    options.encoding = 'UTF-8'
    options.docEncoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.memberLevel = org.gradle.external.javadoc.JavadocMemberLevel.PRIVATE
    options.docTitle = '한정 재고 주문 서버 코드'
    options.windowTitle = '한정 재고 주문 서버 코드'
    options.addBooleanOption('Xdoclint:all,-missing', true)
    options.addBooleanOption('Werror', true)
    options.addBooleanOption('notimestamp', true)
    options.addBooleanOption('-no-platform-links', true)
}

tasks.named('test') {
    useJUnitPlatform()
    maxParallelForks = 1
    systemProperty 'stock.test.classpath', sourceSets.test.runtimeClasspath.asPath
    testLogging { events 'passed', 'failed', 'skipped' }
}
